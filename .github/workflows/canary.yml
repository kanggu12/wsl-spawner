name: canary

# An early warning, once a week: the real stops and starts on WSL's newest
# pre-release (wsl --update --pre-release), which is what the next WSL release
# will be. wsl-spawner leans on how WSL stops a distribution, starts systemd
# and runs Windows programs in it, so a change there shows up here before
# people meet it. A failure here blocks nothing; it says what to look at.
on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wsl:
    name: WSL pre-release
    uses: ./.github/workflows/wsl.yml
    with:
      pre-release: true
