name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Every Monday as well: a new Go patch, runner image or advisory shows up
  # here before it shows up in a release.
  schedule:
    - cron: "17 4 * * 1"
  # The release workflow runs all of CI first.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: lint and unit tests
    # A fixed Ubuntu: ubuntu-latest moves to a new release on its own, with
    # other packages, as it is moving to Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest patch of the Go release go.mod names: it carries the
          # standard library's security fixes.
          go-version: "1.26.x"
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: gofmt, vet and staticcheck for Linux and Windows, shellcheck, go test -race
        run: make check
      - name: fuzzing, 10s per target
        run: make fuzz FUZZTIME=10s
      - name: known vulnerabilities in the code the program reaches, for Linux and Windows
        run: make vuln
      # The notices ship with every release: they must list what it is built from now.
      - name: third-party notices are current
        run: make notices && git diff --exit-code docs/THIRD_PARTY_NOTICES.md

  build:
    name: release build and demo image
    needs: check
    # A fixed Ubuntu: ubuntu-latest moves to a new release on its own, with
    # other packages, as it is moving to Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - run: sudo apt-get update && sudo apt-get install -y zip
      # The release's own script, under a version no release has, so the
      # installers below install what a release would publish.
      - name: the zips, checksums and Scoop manifest
        run: scripts/dist.sh 0.0.0-ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.zip
            dist/checksums.txt
            dist/install.ps1
            dist/wsl-spawner.json
          retention-days: 7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Both platforms the release publishes build; the runner's own is loaded
      # and run: the demo draws, and says which build it is.
      - name: the demo image, for amd64 and arm64
        run: docker buildx build -f docker/demo.Dockerfile --platform linux/amd64,linux/arm64 .
      - name: the demo image runs
        run: |
          docker buildx build -f docker/demo.Dockerfile --load -t wsl-spawner-demo:ci .
          # Read-only but for a temporary folder: the demo keeps its made-up
          # PC there, and nothing anywhere else.
          docker run --rm --read-only --tmpfs /tmp:mode=1777 wsl-spawner-demo:ci version
          docker run --rm --read-only --tmpfs /tmp:mode=1777 wsl-spawner-demo:ci --demo --snapshot 100x30 | tee frame.txt
          grep -q 'sign-out hook' frame.txt

  windows:
    # Every package as a Windows program, on each Windows the runners offer,
    # x64 and ARM64; then the program itself against the runner's own WSL,
    # whatever it has: a missing or inbox WSL is a PC too.
    name: tests on ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      # The Windows calls and wsl.exe's output parsing run where they belong.
      - run: go test -count=1 ./...
      - name: the program on this runner's Windows and WSL
        shell: pwsh
        run: |
          # Exit codes are read below, one command at a time.
          $PSNativeCommandUseErrorActionPreference = $false
          go build -o wsp.exe ./cmd/wsl-spawner
          # What this runner has, for the log.
          [Environment]::OSVersion.Version.ToString()
          $env:PROCESSOR_ARCHITECTURE
          if (Get-Command wsl.exe -ErrorAction SilentlyContinue) { wsl.exe --version; "wsl.exe exits $LASTEXITCODE" } else { 'no wsl.exe' }
          # Settings and history go to a folder of the step's own.
          $env:APPDATA = $env:LOCALAPPDATA = (New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'wsp')).FullName
          ./wsp.exe version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The distributions, as JSON a script reads, empty or not.
          $status = ./wsp.exe status --json
          if ($LASTEXITCODE -ne 0) { $status; "status exited $LASTEXITCODE"; exit 1 }
          $null = $status | ConvertFrom-Json
          # The check reads what this runner has and says each finding: it
          # exits 3 for a finding marked bad, never 1 or 2, and never crashes.
          # Its JSON is read, as the console here may not show its marks.
          ./wsp.exe check
          $check = ./wsp.exe check --json
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3) { $check; "check exited $LASTEXITCODE"; exit 1 }
          if (@(($check | ConvertFrom-Json).groups.findings).Count -eq 0) { 'check found nothing to say'; exit 1 }
          $hook = ./wsp.exe hook status --json
          if ($LASTEXITCODE -ne 0) { $hook; "hook status exited $LASTEXITCODE"; exit 1 }
          if (($hook | ConvertFrom-Json).installed) { 'a hook is installed on a runner that never had one'; exit 1 }
          # Setup by flags, then CLI mode's overview, piped, and the history.
          ./wsp.exe setup --mode cli
          if ($LASTEXITCODE -ne 0) { "setup exited $LASTEXITCODE"; exit 1 }
          ./wsp.exe
          if ($LASTEXITCODE -ne 0) { "the overview exited $LASTEXITCODE"; exit 1 }
          ./wsp.exe history
          if ($LASTEXITCODE -ne 0) { "history exited $LASTEXITCODE"; exit 1 }
          exit 0
      # Windows Server 2022 has the WSL built into Windows, with no
      # --version and only WSL 1: a WSL 1 distribution has nothing to give
      # time to, so it is listed as such and a stop of it is refused.
      - name: a WSL 1 distribution is left be
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $tar = Join-Path $env:RUNNER_TEMP 'alpine.tar.gz'
          Invoke-WebRequest $env:ROOTFS -OutFile $tar
          if ((Get-FileHash $tar -Algorithm SHA256).Hash -ne $env:ROOTFS_SHA256) { 'not the root file system expected'; exit 1 }
          wsl.exe --import wsp-v1 (Join-Path $env:RUNNER_TEMP 'wsp-v1') $tar --version 1
          if ($LASTEXITCODE -ne 0) { "wsl --import exited $LASTEXITCODE"; exit 1 }
          $env:APPDATA = $env:LOCALAPPDATA = (New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'wsp')).FullName
          $status = ./wsp.exe status --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { "status exited $LASTEXITCODE"; exit 1 }
          $d = $status.distributions | Where-Object name -eq 'wsp-v1'
          if (-not $d -or $d.kind -ne 'wsl1') { $status | ConvertTo-Json -Depth 6; 'the WSL 1 distribution is not listed as WSL 1'; exit 1 }
          ./wsp.exe stop wsp-v1 --yes
          if ($LASTEXITCODE -ne 2) { "a stop of a WSL 1 distribution exited $LASTEXITCODE, not 2"; exit 1 }
          wsl.exe --unregister wsp-v1
          exit 0
        env:
          ROOTFS: https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86_64/alpine-minirootfs-3.24.4-x86_64.tar.gz
          ROOTFS_SHA256: cdaa38cb8de3537967ee5b6c9b6cd00cc962da2b018e6eea48696bb274923012

  wsl:
    # Real stops and starts on a real WSL 2: the jobs are in wsl.yml, which
    # the weekly canary runs on WSL's newest pre-release too.
    needs: check
    uses: ./.github/workflows/wsl.yml

  # install.ps1 as people run it, on the zip the build above made: in
  # PowerShell 7 and in Windows PowerShell 5.1, which every Windows has, and
  # on ARM64, where it must pick the arm64 zip. A step's shell cannot come
  # from a matrix, so each has its own job.
  installer-pwsh:
    name: install.ps1 in PowerShell 7
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: install, run, remove
        shell: pwsh
        run: |
          $env:WSL_SPAWNER_ZIP = (Resolve-Path dist/wsl-spawner_0.0.0-ci_windows_amd64.zip).Path
          & ([scriptblock]::Create((Get-Content dist/install.ps1 -Raw)))
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\wsl-spawner'
          $exe = Join-Path $dir 'wsl-spawner.exe'
          $v = & $exe version
          $v
          if ($v -notmatch '^wsl-spawner v0\.0\.0-ci ') { 'not the build just installed'; exit 1 }
          if (-not (Test-Path (Join-Path $dir 'wsl-spawnerw.exe'))) { 'no build with no console'; exit 1 }
          if (-not (Test-Path (Join-Path $dir 'wsl-spawner'))) { 'no launcher for WSL'; exit 1 }
          if (-not (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $dir)) { 'not on PATH'; exit 1 }
          $env:WSL_SPAWNER_UNINSTALL = '1'
          & ([scriptblock]::Create((Get-Content dist/install.ps1 -Raw)))
          # The program removes its folder a moment after it exits.
          for ($i = 0; $i -lt 60 -and (Test-Path $dir); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $dir) { 'the folder is still there'; exit 1 }
          if ((([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $dir)) { 'still on PATH'; exit 1 }
          # Installed again, the program removes itself: its folder goes a
          # moment after it exits, and with it the PATH entry.
          & ([scriptblock]::Create((Get-Content dist/install.ps1 -Raw)))
          & $exe uninstall --yes
          if ($LASTEXITCODE -ne 0) { 'wsl-spawner uninstall failed'; exit 1 }
          for ($i = 0; $i -lt 60 -and (Test-Path $dir); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $dir) { 'the folder is still there after wsl-spawner uninstall'; exit 1 }
          if ((([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $dir)) { 'still on PATH after wsl-spawner uninstall'; exit 1 }
          exit 0

  installer-powershell:
    name: install.ps1 in Windows PowerShell 5.1
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: install, run, remove
        shell: powershell
        run: |
          $env:WSL_SPAWNER_ZIP = (Resolve-Path dist/wsl-spawner_0.0.0-ci_windows_amd64.zip).Path
          & ([scriptblock]::Create((Get-Content dist/install.ps1 -Raw)))
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\wsl-spawner'
          $exe = Join-Path $dir 'wsl-spawner.exe'
          $v = & $exe version
          $v
          if ($v -notmatch '^wsl-spawner v0\.0\.0-ci ') { 'not the build just installed'; exit 1 }
          if (-not (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $dir)) { 'not on PATH'; exit 1 }
          $env:WSL_SPAWNER_UNINSTALL = '1'
          & ([scriptblock]::Create((Get-Content dist/install.ps1 -Raw)))
          # The program removes its folder a moment after it exits.
          for ($i = 0; $i -lt 60 -and (Test-Path $dir); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $dir) { 'the folder is still there'; exit 1 }
          # Installed again, with settings, the program removes itself and,
          # with --purge, the settings.
          & ([scriptblock]::Create((Get-Content dist/install.ps1 -Raw)))
          & $exe setup --mode cli
          $settings = Join-Path $env:APPDATA 'wsl-spawner'
          if (-not (Test-Path (Join-Path $settings 'config.toml'))) { 'no settings to remove'; exit 1 }
          & $exe uninstall --purge --yes
          if ($LASTEXITCODE -ne 0) { 'wsl-spawner uninstall --purge failed'; exit 1 }
          for ($i = 0; $i -lt 60 -and (Test-Path $dir); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $dir) { 'the folder is still there after wsl-spawner uninstall'; exit 1 }
          if (Test-Path $settings) { 'the settings are still there after wsl-spawner uninstall --purge'; exit 1 }
          if ((([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $dir)) { 'still on PATH after wsl-spawner uninstall'; exit 1 }
          exit 0

  installer-arm64:
    name: install.ps1 on Windows 11 on Arm
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # The arm64 build installed and run on ARM64 Windows. Which zip the
      # script picks by the machine's processor is checked after a release,
      # where it downloads one (.github/workflows/installers.yml).
      - name: install, run, remove
        shell: powershell
        run: |
          $env:WSL_SPAWNER_ZIP = (Resolve-Path dist/wsl-spawner_0.0.0-ci_windows_arm64.zip).Path
          & ([scriptblock]::Create((Get-Content dist/install.ps1 -Raw)))
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\wsl-spawner\wsl-spawner.exe'
          $v = & $exe version
          $v
          if ($v -notmatch '^wsl-spawner v0\.0\.0-ci ') { 'the arm64 build did not run'; exit 1 }
          $env:WSL_SPAWNER_UNINSTALL = '1'
          & ([scriptblock]::Create((Get-Content dist/install.ps1 -Raw)))
          # The program removes its folder a moment after it exits.
          for ($i = 0; $i -lt 60 -and (Test-Path (Split-Path $exe)); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path (Split-Path $exe)) { 'the folder is still there'; exit 1 }
          exit 0
