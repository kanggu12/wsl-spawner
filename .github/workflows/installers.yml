name: installers

# The installers as people run them, from a published release: install.ps1
# in PowerShell 7 and in Windows PowerShell 5.1, on x64 and on ARM64, where it
# must pick the arm64 zip by itself; an administrator's install under Program
# Files, with a standard user after it; the Scoop manifest; and the demo
# image. Each installs, runs the program, and removes it again.
# A release made by the release workflow does not start other workflows, so
# that workflow calls this one once the release is out.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: release to install, like v0.1.0
        required: true

permissions:
  contents: read

jobs:
  pwsh:
    name: install.ps1 in PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      # A release is installed the way the README says, through "latest";
      # a pre-release, which "latest" skips, by its own address.
      - name: install, run, remove
        shell: pwsh
        env:
          WANT: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:WANT -match '-') {
            $env:WSL_SPAWNER_VERSION = $env:WANT
            $env:SCRIPT = "https://github.com/$env:REPO/releases/download/$env:WANT/install.ps1"
          } else {
            $env:SCRIPT = "https://github.com/$env:REPO/releases/latest/download/install.ps1"
          }
          $env:WSL_SPAWNER_VERSION_WANTED = $env:WANT
          irm $env:SCRIPT | iex
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\wsl-spawner'
          $v = & (Join-Path $dir 'wsl-spawner.exe') version
          $v
          if ($v -notmatch ('^wsl-spawner ' + [regex]::Escape($env:WSL_SPAWNER_VERSION_WANTED) + ' ')) { 'not the release asked for'; exit 1 }
          if (-not (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $dir)) { 'not on PATH'; exit 1 }
          $env:WSL_SPAWNER_UNINSTALL = '1'
          irm $env:SCRIPT | iex
          # The program removes its folder a moment after it exits.
          for ($i = 0; $i -lt 60 -and (Test-Path $dir); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $dir) { 'the folder is still there'; exit 1 }
          if ((([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $dir)) { 'still on PATH'; exit 1 }
          # The flag is one-shot: the script cleared it.
          if ($env:WSL_SPAWNER_UNINSTALL) { 'the uninstall flag is still set'; exit 1 }
          exit 0

  powershell:
    name: install.ps1 in Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: install, run, remove
        shell: powershell
        env:
          WSL_SPAWNER_VERSION: ${{ inputs.version }}
          SCRIPT: https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/install.ps1
        run: |
          irm $env:SCRIPT | iex
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\wsl-spawner'
          $v = & (Join-Path $dir 'wsl-spawner.exe') version
          $v
          if ($v -notmatch ('^wsl-spawner ' + [regex]::Escape($env:WSL_SPAWNER_VERSION) + ' ')) { 'not the release asked for'; exit 1 }
          $env:WSL_SPAWNER_UNINSTALL = '1'
          irm $env:SCRIPT | iex
          # The program removes its folder a moment after it exits.
          for ($i = 0; $i -lt 60 -and (Test-Path $dir); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $dir) { 'the folder is still there'; exit 1 }
          exit 0

  arm64:
    name: install.ps1 on Windows 11 on Arm
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - name: install, check it is the arm64 build, remove
        shell: powershell
        env:
          WSL_SPAWNER_VERSION: ${{ inputs.version }}
          SCRIPT: https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/install.ps1
        run: |
          irm $env:SCRIPT | iex
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\wsl-spawner\wsl-spawner.exe'
          & $exe version
          # The program's header names its processor: 0xAA64 is ARM64.
          $b = [IO.File]::ReadAllBytes($exe)
          $machine = [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3c) + 4)
          if ($machine -ne 0xAA64) { 'installed a build for machine 0x{0:X4}, not ARM64' -f $machine; exit 1 }
          $env:WSL_SPAWNER_UNINSTALL = '1'
          irm $env:SCRIPT | iex
          # The program removes its folder a moment after it exits.
          for ($i = 0; $i -lt 60 -and (Test-Path (Split-Path $exe)); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path (Split-Path $exe)) { 'the folder is still there'; exit 1 }
          exit 0

  standard-user:
    name: an administrator's install, and a standard user after it
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # As docs/setup.md says for a standard user: an administrator installs
      # under Program Files, and the sign-out hook from there. Then a real
      # standard user, a member of Users and nothing more, looks at it and
      # uninstalls: the hook's program is one they cannot change, and the
      # program one they may not delete.
      - name: install under Program Files, hook, a standard user's check and uninstall, remove
        shell: pwsh
        env:
          WANT: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $env:WSL_SPAWNER_VERSION = $env:WANT
          $env:WSL_SPAWNER_BIN_DIR = "$env:ProgramFiles\wsl-spawner"
          $env:WSL_SPAWNER_NO_SETUP = '1'
          irm "https://github.com/$env:REPO/releases/download/$env:WANT/install.ps1" | iex
          $dir = "$env:ProgramFiles\wsl-spawner"
          $exe = "$dir\wsl-spawner.exe"
          $v = & $exe version
          $v
          if ($v -notmatch ('^wsl-spawner ' + [regex]::Escape($env:WANT) + ' ')) { 'not the release asked for'; exit 1 }
          # The runner is an administrator: the hook goes in with no question
          # from Windows. 3 is installed, but not read by Windows yet.
          & $exe hook install --yes
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3) { "hook install exited $LASTEXITCODE"; exit 1 }
          # The standard user, with a password of this run's own.
          $pw = 'Wsp!' + [guid]::NewGuid().ToString('N').Substring(0, 20) + 'aA1'
          net.exe user wspstd $pw /add /y | Out-Null
          if ($LASTEXITCODE -ne 0) { 'the account was not made'; exit 1 }
          $cred = [pscredential]::new('wspstd', (ConvertTo-SecureString $pw -AsPlainText -Force))
          # Where that user and this one both write: what the program printed.
          $share = 'C:\Users\Public\wsl-spawner-standard-user'
          New-Item -ItemType Directory -Path $share -Force | Out-Null
          icacls $share /grant '*S-1-1-0:(OI)(CI)M' | Out-Null
          # AsStandardUser runs the program with $arguments as that user, in
          # their own environment, and leaves what it printed in $said and
          # its exit code in $code.
          function AsStandardUser([string]$arguments) {
            $out = "$share\out.txt"
            Remove-Item -LiteralPath $out -ErrorAction SilentlyContinue
            Set-Content -LiteralPath "$share\run.cmd" -Encoding ascii -Value @('@echo off', "`"$exe`" $arguments > `"$out`" 2>&1", "(echo exit=%ERRORLEVEL%) >> `"$out`"")
            $p = Start-Process -FilePath "$env:SystemRoot\System32\cmd.exe" -ArgumentList '/c', "$share\run.cmd" -Credential $cred -LoadUserProfile -UseNewEnvironment -WorkingDirectory $share -PassThru
            if (-not $p.WaitForExit(120000)) { "wsl-spawner $arguments did not end for the standard user"; exit 1 }
            $script:said = Get-Content -LiteralPath $out -Raw
            $script:code = if ($script:said -match '(?m)^exit=(\d+)\s*$') { [int]$Matches[1] } else { -1 }
            "as the standard user, wsl-spawner $arguments :"
            $script:said
          }
          # Their check finds the hook, and no one who can change its program.
          AsStandardUser 'check'
          if ($said -notmatch 'sign-out hook installed' -or $said -match 'can change') { 'the standard user does not see the hook as it is'; exit 1 }
          # The hook comes out as the administrator; with it there, the
          # standard user's uninstall would have Windows ask for one.
          & $exe hook remove --yes
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3) { "hook remove exited $LASTEXITCODE"; exit 1 }
          # Their uninstall takes out what was theirs and leaves the program,
          # which they may not delete, saying who removes it.
          AsStandardUser 'uninstall --yes'
          if ($code -ne 0 -or $said -notmatch 'the program stays in') { 'the standard user is not told the program stays'; exit 1 }
          foreach ($f in 'wsl-spawner.exe', 'wsl-spawnerw.exe', 'wsl-spawner') { if (-not (Test-Path "$dir\$f")) { "$f went"; exit 1 } }
          # The administrator's uninstall removes it.
          & $exe uninstall --yes
          if ($LASTEXITCODE -ne 0) { "the administrator's uninstall exited $LASTEXITCODE"; exit 1 }
          # The program removes its folder a moment after it exits.
          for ($i = 0; $i -lt 60 -and (Test-Path $dir); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $dir) { 'the folder is still there'; exit 1 }
          net.exe user wspstd /delete | Out-Null
          exit 0

  scoop:
    name: the Scoop manifest
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: install with Scoop, run, remove
        shell: pwsh
        env:
          MANIFEST: https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/wsl-spawner.json
          VERSION: ${{ inputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          # The runner is an administrator, which Scoop refuses unless told.
          iex "& {$(irm https://get.scoop.sh)} -RunAsAdmin"
          $env:Path = (Join-Path $env:USERPROFILE 'scoop\shims') + ';' + $env:Path
          scoop install $env:MANIFEST
          if ($LASTEXITCODE -ne 0) { 'scoop install failed'; exit 1 }
          $v = wsl-spawner version
          $v
          if ($v -notmatch ('^wsl-spawner ' + [regex]::Escape($env:VERSION) + ' ')) { 'not the release asked for'; exit 1 }
          # The program leaves what Scoop installed to Scoop: it takes out
          # what it put on the PC, keeps the settings, and says how the
          # program is removed.
          wsl-spawner setup --mode cli
          $settings = Join-Path $env:APPDATA 'wsl-spawner\config.toml'
          if (-not (Test-Path $settings)) { 'setup wrote no settings'; exit 1 }
          $said = wsl-spawner uninstall --yes 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $said -notmatch 'scoop uninstall wsl-spawner removes the program') { "wsl-spawner uninstall did not leave the Scoop install to Scoop: $said"; exit 1 }
          if (-not (Get-Command wsl-spawner -ErrorAction SilentlyContinue)) { 'the program went'; exit 1 }
          if (-not (Test-Path $settings)) { 'the settings went without --purge'; exit 1 }
          # With --purge the settings go too, and the program still stays.
          wsl-spawner uninstall --purge --yes
          if ($LASTEXITCODE -ne 0) { 'wsl-spawner uninstall --purge failed'; exit 1 }
          if (Test-Path (Join-Path $env:APPDATA 'wsl-spawner')) { 'the settings are still there'; exit 1 }
          if (-not (Get-Command wsl-spawner -ErrorAction SilentlyContinue)) { 'the program went with --purge'; exit 1 }
          scoop uninstall wsl-spawner
          if ($LASTEXITCODE -ne 0) { 'scoop uninstall failed'; exit 1 }
          exit 0

  demo-image:
    name: the demo image
    # A fixed Ubuntu: ubuntu-latest moves to a new release on its own, with
    # other packages, as it is moving to Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: pull, run
        env:
          VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wsl-spawner-demo:${VERSION#v}"
          docker run --rm --read-only --tmpfs /tmp:mode=1777 "$image" version | tee version.txt
          grep -q "^wsl-spawner $VERSION " version.txt
          docker run --rm --read-only --tmpfs /tmp:mode=1777 "$image" --demo --snapshot 100x30 | grep -q 'sign-out hook'
